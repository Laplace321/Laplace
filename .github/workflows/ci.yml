name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check server/ tests/ extractor/
      - run: ruff format --check server/ tests/ extractor/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt anyio
      - name: Dependency completeness check
        run: |
          # 扫描 server/ 下所有 Python 文件的顶层 import，提取第三方包名
          # 与 server/requirements.txt 中声明的包名交叉比对
          python3 -c "
          import re, sys
          from pathlib import Path

          # 从 requirements.txt 提取已声明的包名（统一小写，去掉版本约束）
          req_file = Path('server/requirements.txt')
          declared = set()
          for line in req_file.read_text().splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              pkg = re.split(r'[>=<!\[]', line)[0].strip().lower().replace('-', '_')
              declared.add(pkg)

          # 标准库 + 已知内置模块白名单（不需要在 requirements.txt 中声明）
          STDLIB = {
              '__future__',
              'os', 'sys', 're', 'json', 'time', 'uuid', 'pathlib', 'typing',
              'dataclasses', 'enum', 'abc', 'collections', 'functools', 'itertools',
              'logging', 'hashlib', 'math', 'datetime', 'copy', 'io', 'textwrap',
              'contextlib', 'contextvars', 'asyncio', 'concurrent', 'threading', 'multiprocessing',
              'importlib', 'inspect', 'traceback', 'warnings', 'unittest', 'string',
              'struct', 'socket', 'http', 'urllib', 'email', 'html', 'xml',
              'csv', 'sqlite3', 'gzip', 'zipfile', 'tarfile', 'tempfile', 'shutil',
              'glob', 'fnmatch', 'stat', 'platform', 'subprocess', 'signal',
              'argparse', 'configparser', 'secrets', 'base64', 'binascii',
              'pprint', 'dis', 'ast', 'token', 'tokenize', 'types', 'weakref',
              'array', 'bisect', 'heapq', 'queue', 'decimal', 'fractions',
              'random', 'statistics', 'operator', 'pickle', 'shelve', 'marshal',
              'dbm', 'codecs', 'unicodedata', 'locale', 'gettext', 'difflib',
          }

          # 项目内部模块前缀
          INTERNAL_PREFIXES = ('server', 'tests', 'extractor', 'admin')

          # 传递依赖白名单：这些包由已声明的依赖自动安装，无需单独声明
          TRANSITIVE_DEPS = {
              'starlette',       # fastapi 的底层依赖
              'anyio',           # starlette/fastapi 的异步依赖
              'sniffio',         # anyio 的依赖
              'h11',             # uvicorn/httpx 的 HTTP 解析依赖
              'certifi',         # requests/httpx 的 CA 证书
              'charset_normalizer', 'chardet',  # requests 的编码检测
              'idna',            # requests/httpx 的域名编码
              'annotated_types', 'typing_extensions',  # pydantic 的依赖
              'jiter',           # openai SDK 的 JSON 解析依赖
              'distro',          # openai SDK 的系统信息依赖
              'tqdm',            # dashscope 的进度条依赖
          }

          # 扫描 server/ 下所有 .py 文件的顶层 import
          imported_pkgs = set()
          for py_file in Path('server').rglob('*.py'):
              for line in py_file.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  m = re.match(r'^(?:import|from)\s+([a-zA-Z_][a-zA-Z0-9_]*)', line)
                  if m:
                      pkg = m.group(1).lower()
                      if pkg not in STDLIB and not any(pkg.startswith(p) for p in INTERNAL_PREFIXES):
                          imported_pkgs.add(pkg)

          # 特殊映射：import 名 → requirements.txt 中的包名
          ALIAS_MAP = {
              'yaml': 'pyyaml',
              'dotenv': 'python_dotenv',
              'cv2': 'opencv_python',
              'PIL': 'pillow',
              'bs4': 'beautifulsoup4',
          }
          normalized_imported = set()
          for pkg in imported_pkgs:
              normalized = ALIAS_MAP.get(pkg, pkg)
              # 排除传递依赖（由已声明包自动安装）
              if normalized not in TRANSITIVE_DEPS:
                  normalized_imported.add(normalized)

          missing = normalized_imported - declared
          if missing:
              print(f'ERROR: 以下第三方依赖在 server/ 中被 import 但未在 server/requirements.txt 中声明:')
              for m in sorted(missing):
                  print(f'  - {m}')
              sys.exit(1)
          else:
              print(f'OK: 所有 {len(normalized_imported)} 个第三方依赖均已在 requirements.txt 中声明')
          "
      - run: python -m pytest -v
