[project]
name = "laplace"
version = "0.5.0"
description = "AI Native FGO Data Assistant"
requires-python = ">=3.12"
# 运行时依赖以 server/requirements.txt 为唯一权威清单（Dockerfile 和 CI 均使用该文件）
# 此处不声明 dependencies，避免双轨制导致依赖遗漏
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "ruff>=0.9.0",
]

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
]
ignore = [
    "E501",  # line too long — handled by formatter
    "E741",  # ambiguous variable name (common in math-heavy code)
]

[tool.ruff.lint.per-file-ignores]
"server/main.py" = ["E402"]  # 入口文件：load_dotenv() 必须在 server.* import 之前执行

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
