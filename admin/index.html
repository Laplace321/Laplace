<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laplace Admin</title>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" crossorigin>
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
    <!-- 登录页面 -->
    <div id="login-page" class="page">
        <div class="login-card">
            <h2>LAPLACE ADMIN</h2>
            <form id="login-form" action="javascript:void(0)">
                <input type="password" id="password-input" placeholder="请输入管理员密码" autocomplete="current-password" required>
                <button type="submit" id="login-btn">登录</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- 管理页面 -->
    <div id="admin-page" class="page" style="display:none;">
        <header>
            <h1>LAPLACE ADMIN</h1>
            <div class="header-actions">
                <a href="/logs.html" class="header-link">日志 BI</a>
                <button id="logout-btn" class="btn-secondary">登出</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="env">环境变量</button>
            <button class="tab" data-tab="config">配置文件</button>
        </nav>

        <!-- 环境变量 Tab -->
        <section id="tab-env" class="tab-content active">
            <div class="section-header">
                <h3>环境变量 (.env)</h3>
                <div class="btn-group">
                    <button id="env-save-btn" class="btn-primary">保存</button>
                    <button id="env-restart-btn" class="btn-danger">重启容器</button>
                </div>
            </div>
            <div id="env-source-hint" class="env-source-hint" style="display:none;"></div>
            <textarea id="env-editor" spellcheck="false" placeholder="加载中..."></textarea>
            <p id="env-status" class="status-msg"></p>
        </section>

        <!-- 配置文件 Tab -->
        <section id="tab-config" class="tab-content">
            <div class="section-header">
                <h3>配置文件</h3>
            </div>
            <div class="config-layout">
                <ul id="config-list" class="config-sidebar"></ul>
                <div class="config-editor-wrap">
                    <div class="config-editor-header">
                        <span id="config-current-file">选择一个配置文件</span>
                        <button id="config-save-btn" class="btn-primary" disabled>保存</button>
                    </div>
                    <textarea id="config-editor" spellcheck="false" placeholder="选择左侧配置文件进行编辑" disabled></textarea>
                    <p id="config-status" class="status-msg"></p>
                </div>
            </div>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
